name: Release

on:
  push:
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      actions: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Resolve workspace protocol dependencies for publishing
        run: bun run resolve-workspace-deps

      - name: Setup npm auth
        run: echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > ~/.npmrc

      - name: Create Release Pull Request or Publish
        id: changesets
        uses: changesets/action@v1
        with:
          version: bun run version
          publish: bun run release
          commit: "chore: version packages"
          title: "chore: version packages"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Delete per-package tags and releases
        run: |
          # Changesets publishes fixed packages together, but it can still create package-scoped tags/releases.
          # Spectra ships one unified GitHub release (vX.Y.Z), so remove package-scoped artifacts.
          for TAG in $(git tag -l "@mohanscodex/spectra-*"); do
            git push origin ":refs/tags/$TAG" || true
          done
          for RELEASE in $(gh release list --limit 100 --json tagName --jq '.[] | select(.tagName | startswith("@mohanscodex/")) | .tagName'); do
            gh release delete "$RELEASE" --yes 2>/dev/null || true
          done
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create unified GitHub release
        if: steps.changesets.outputs.published == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');

          const packages = JSON.parse(process.env.PUBLISHED_PACKAGES || '[]');
          if (packages.length === 0) throw new Error('No published packages found');

          const version = packages[0].version;
          const changelogPaths = [
            'packages/code/CHANGELOG.md',
            'packages/ai/CHANGELOG.md',
            'packages/agent/CHANGELOG.md',
            'packages/app/CHANGELOG.md',
          ];

          let changes = '';
          for (const path of changelogPaths) {
            if (!fs.existsSync(path)) continue;
            const changelog = fs.readFileSync(path, 'utf8');
            const match = changelog.match(new RegExp(`## ${version}\\n([\\s\\S]*?)(?=\\n## |$)`));
            if (match) {
              changes = match[1].trim();
              break;
            }
          }

          changes = changes
            .replace(/^### Minor Changes\s*/m, '')
            .replace(/^- \[`[^\]]+`\]\([^)]+\) Thanks \[[^\]]+\]\([^)]+\)! - /m, '')
            .replace(/\n- Updated dependencies[\s\S]*$/m, '')
            .trim();

          const packageList = packages
            .map((pkg) => `- \`${pkg.name}@${pkg.version}\``)
            .join('\n');

          const notes = [
            `# Spectra v${version}`,
            '',
            '## Published packages',
            '',
            packageList,
            '',
            '## Release notes',
            '',
            changes || 'See package changelogs for details.',
            '',
          ].join('\n');

          fs.writeFileSync('release-notes.md', notes);
          fs.writeFileSync('release-version.txt', version);
          NODE

          VERSION=$(cat release-version.txt)
          TAG="v$VERSION"
          git fetch --tags origin "$TAG" || true

          if ! git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "Spectra $TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --title "Spectra $TAG" --notes-file release-notes.md --target "$GITHUB_SHA"
          fi

          gh workflow run build-binaries.yml --ref main -f tag="$TAG"
      - name: Smoke test published packages
        if: steps.changesets.outputs.published == 'true'
        run: |
          echo "==> Waiting for npm registry propagation..."
          sleep 30

          # Get the published version from changesets output
          VERSION=$(echo '${{ steps.changesets.outputs.publishedPackages }}' | jq -r '.[0].version')
          echo "Published version: $VERSION"

          # Create isolated test directory
          WORKDIR=$(mktemp -d)
          cd "$WORKDIR"

          cat > package.json << 'EOF'
          {
            "name": "release-smoke-test",
            "private": true,
            "type": "module"
          }
          EOF

          echo "==> Installing published packages..."
          npm install \
            @mohanscodex/spectra-ai@$VERSION \
            @mohanscodex/spectra-agent@$VERSION \
            @mohanscodex/spectra-app@$VERSION \
            @mohanscodex/spectra-code@$VERSION

          echo "==> Verifying imports..."
          node --input-type=module -e "
            import { EventStream, stream } from '@mohanscodex/spectra-ai';
            import { Agent, defineTool } from '@mohanscodex/spectra-agent';
            import { SessionManager } from '@mohanscodex/spectra-app';
            import { loadConfig, SessionStore } from '@mohanscodex/spectra-code';
            import { z } from 'zod';

            // Verify each package loads
            new EventStream();
            console.log('  @mohanscodex/spectra-ai: OK');

            const tool = defineTool({
              name: 'test', description: 'test',
              parameters: z.object({ x: z.string() }),
              execute: async ({ x }) => ({ content: [{ type: 'text', text: x }] }),
            });
            console.log('  @mohanscodex/spectra-agent: OK');

            new SessionManager({ model: 'anthropic/claude-3-haiku-20240307' });
            console.log('  @mohanscodex/spectra-app: OK');

            console.assert(typeof loadConfig === 'function', 'loadConfig must be a function');
            console.assert(typeof SessionStore === 'function', 'SessionStore must be a constructor');
            console.log('  @mohanscodex/spectra-code: OK');

            console.log('==> All smoke tests passed.');
          "

          rm -rf "$WORKDIR"
